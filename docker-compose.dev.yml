services:
  freetoken:
    container_name: freetoken
    build:
      context: .
      dockerfile: docker/freetoken.Dockerfile
    image: freetoken:dev
    restart: unless-stopped
    init: true
    gpus: all
    ipc: host
    env_file: [.env]
    environment:
      FREETOKEN_HOST: "0.0.0.0"
      FREETOKEN_PORT: "1919"
      FREETOKEN_CONTROL_PORT: "1918"
      HF_HOME: /hf-cache
    volumes:
      - "${MODELS_PATH:-./models}:/models"
      - "${HF_CACHE_PATH:-./hf-cache}:/hf-cache"
    expose: ["1918", "1919"]
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${FREETOKEN_PORT:-1919}:1919"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1918/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  freetoken-webui:
    container_name: freetoken-webui
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: freetoken-webui:dev
    restart: unless-stopped
    init: true
    depends_on:
      freetoken:
        condition: service_healthy
        restart: true
    env_file: [.env]
    environment:
      FREETOKEN_MODE: managed
      FREETOKEN_URL: "http://freetoken:1919"
      FREETOKEN_CONTROL_URL: "http://freetoken:1918"
      WEB_PORT: "3000"
      MODELS_DIR: /models
      DATA_DIR: /data
      HF_HOME: /hf-cache
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    volumes:
      - "${MODELS_PATH:-./models}:/models"
      - "${DATA_PATH:-./data}:/data"
      - "${HF_CACHE_PATH:-./hf-cache}:/hf-cache"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
