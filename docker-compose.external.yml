services:
  freetoken-web:
    image: ghcr.io/h8ntome/freetoken-webui:${IMAGE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    init: true
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    env_file: [.env]
    environment:
      FREETOKEN_MODE: external
      WEB_PORT: "3000"
      DATA_DIR: /data
      MODELS_DIR: /models
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${DATA_PATH:-./data}:/data"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
