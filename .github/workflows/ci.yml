name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: pytest -q
        working-directory: backend
      - name: Validate Compose definitions
        run: |
          cp .env.example .env
          docker compose config -q
          docker compose -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.external.yml config -q
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Build and smoke-test GPU-free WebUI container
        run: |
          docker build -f docker/Dockerfile -t freetoken-webui:test .
          docker run -d --name webui-test -e FREETOKEN_MODE=external -e FREETOKEN_EXTERNAL_URL=http://127.0.0.1:9 -p 3000:3000 freetoken-webui:test
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/healthz; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/healthz
          curl -fsS http://localhost:3000/api/auth/me
          docker logs webui-test
          docker rm -f webui-test
