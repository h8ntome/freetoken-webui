services:
  freetoken-web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: freetoken-web:local
    restart: unless-stopped
    init: true
    gpus: all
    ipc: host
    ports:
      - "${WEB_PORT:-3000}:3000"
      - "${FREETOKEN_PORT:-1919}:1919"
    env_file:
      - .env
    environment:
      WEB_PORT: "3000"
      FREETOKEN_HOST: "0.0.0.0"
      FREETOKEN_PORT: "1919"
      MODELS_DIR: /models
      DATA_DIR: /data
      HF_HOME: /hf-cache
    volumes:
      - "${MODELS_PATH:-./models}:/models"
      - "${DATA_PATH:-./data}:/data"
      - "${HF_CACHE_PATH:-./hf-cache}:/hf-cache"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

