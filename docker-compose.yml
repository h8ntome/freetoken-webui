services:
  freetoken:
    image: "${FREETOKEN_IMAGE:-freetoken-upstream:0.1.2}"
    build:
      context: .
      dockerfile: docker/freetoken.Dockerfile
    pull_policy: build
    restart: unless-stopped
    gpus: all
    ipc: host
    environment:
      FREETOKEN_DAEMON_TOKEN: ${FREETOKEN_DAEMON_TOKEN:-}
      HF_HOME: /hf-cache
    volumes:
      - "${FREETOKEN_STATE_PATH:-./freetoken-state}:/state"
      - "${MODELS_PATH:-./models}:/models:ro"
      - "${HF_CACHE_PATH:-./hf-cache}:/hf-cache"
    expose:
      - "1900"
      - "1919"
    ports:
      - "${API_BIND_ADDRESS:-0.0.0.0}:${FREETOKEN_PORT:-1919}:1919"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1900/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  freetoken-webui:
    image: "freetoken-webui:${IMAGE_TAG:-local}"
    build:
      context: .
      dockerfile: docker/Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on:
      freetoken:
        condition: service_healthy
        restart: true
    environment:
      FREETOKEN_MODE: managed
      FREETOKEN_URL: "http://freetoken:1919"
      FREETOKEN_CONTROL_URL: "http://freetoken:1900"
      FREETOKEN_DAEMON_TOKEN: "${FREETOKEN_DAEMON_TOKEN:-}"
      FREETOKEN_EXTRA_ARGS: "${FREETOKEN_EXTRA_ARGS:-}"
      WEB_PORT: "3000"
      MODELS_DIR: /models
      DATA_DIR: /data
      HF_HOME: /hf-cache
      HF_TOKEN: "${HF_TOKEN:-}"
      AUTH_ENABLED: "${AUTH_ENABLED:-false}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-}"
      SECURE_COOKIES: "${SECURE_COOKIES:-false}"
      PUBLIC_API_BASE_URL: "${PUBLIC_API_BASE_URL:-}"
      METRICS_INTERVAL_SECONDS: "${METRICS_INTERVAL_SECONDS:-2}"
      ALLOWED_IMPORT_DIRS: "${ALLOWED_IMPORT_DIRS:-}"
      ENGINE_READY_TIMEOUT_SECONDS: "${ENGINE_READY_TIMEOUT_SECONDS:-900}"
      ENGINE_STOP_TIMEOUT_SECONDS: "${ENGINE_STOP_TIMEOUT_SECONDS:-20}"
      ENGINE_PROXY_RETRIES: "${ENGINE_PROXY_RETRIES:-3}"
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-3000}:3000"
    volumes:
      - "${MODELS_PATH:-./models}:/models"
      - "${DATA_PATH:-./data}:/data"
      - "${HF_CACHE_PATH:-./hf-cache}:/hf-cache"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/healthz"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
